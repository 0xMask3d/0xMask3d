<svg width="720" height="110" viewBox="0 0 720 110" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0D1117; stroke: #1F2937; stroke-width: 1.5; }
    .prompt { font: 700 22px 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; fill: #00FF41; }
